<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>VoxelGame</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="jumpBtn">↑</div>

  <div id="hotbar">
    <div class="slot selected" data-block="1"><span class="num">1</span><div class="color" style="background:#4caf50"></div></div>
    <div class="slot" data-block="2"><span class="num">2</span><div class="color" style="background:#8b5a2b"></div></div>
    <div class="slot" data-block="3"><span class="num">3</span><div class="color" style="background:#888888"></div></div>
    <div class="slot" data-block="4"><span class="num">4</span><div class="color" style="background:#e8d68a"></div></div>
    <div class="slot" data-block="5"><span class="num">5</span><div class="color" style="background:#6b4423"></div></div>
  </div>

  <div id="info">
    <div class="row">
      <span>X: <span class="val" id="infoX">0</span></span>
      <span>Z: <span class="val" id="infoZ">0</span></span>
      <span>Y: <span class="val" id="infoY">0</span></span>
    </div>
  </div>

  <div id="crosshair"></div>

  <div id="errorBox" style="
    position: fixed; top: 50px; left: 10px; right: 10px;
    background: rgba(200,0,0,0.9); color: white;
    padding: 10px; border-radius: 6px;
    font-size: 11px; font-family: monospace;
    z-index: 999; display: none; white-space: pre-wrap;
    max-height: 40vh; overflow: auto;
  "></div>

  <script>
    window.addEventListener('error', e => {
      const box = document.getElementById('errorBox');
      if (box) {
        box.style.display = 'block';
        box.textContent += '❌ ' + e.message + '\n  at ' + (e.filename || '?') + ':' + e.lineno + '\n\n';
      }
    });
    window.addEventListener('unhandledrejection', e => {
      const box = document.getElementById('errorBox');
      if (box) {
        box.style.display = 'block';
        box.textContent += '❌ Promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '\n\n';
      }
    });
  </script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
