<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>VoxelGame</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      overflow: hidden;
      background: #111;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, sans-serif;
    }
    canvas { display: block; }

    /* ==== JOYSTICK (kiri bawah) ==== */
    #joyBase {
      position: fixed;
      left: 30px;
      bottom: 40px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.35);
      pointer-events: none;
      z-index: 10;
    }
    #joyKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 2px solid rgba(255,255,255,0.7);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ==== TOMBOL LOMPAT (kanan bawah) ==== */
    #jumpBtn {
      position: fixed;
      right: 40px;
      bottom: 60px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.85);
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }
    #jumpBtn.active {
      background: rgba(255,255,255,0.35);
    }

    /* ==== HOTBAR (bawah tengah) ==== */
    #hotbar {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    .slot {
      width: 44px;
      height: 44px;
      background: rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.4);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .slot.selected {
      border-color: #ffd54f;
      box-shadow: 0 0 8px #ffd54f;
    }
    .slot .color {
      width: 28px;
      height: 28px;
      border-radius: 3px;
    }
    .slot .num {
      position: absolute;
      top: 2px;
      left: 4px;
      font-size: 10px;
      color: white;
      text-shadow: 1px 1px 2px black;
    }

    /* ==== INFO KOORDINAT (kiri atas) ==== */
    #info {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.45);
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 10;
      pointer-events: none;
      line-height: 1.4;
    }
    #info .row { display: flex; gap: 10px; }
    #info .val { color: #a5d6a7; font-weight: bold; }

    /* ==== CROSSHAIR (tengah) ==== */
    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 22px;
      height: 22px;
      transform: translate(-50%, -50%);
      z-index: 10;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.7);
      box-shadow: 0 0 2px black;
    }
    #crosshair::before {
      left: 50%; top: 0; width: 2px; height: 100%;
      transform: translateX(-50%);
    }
    #crosshair::after {
      top: 50%; left: 0; height: 2px; width: 100%;
      transform: translateY(-50%);
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="jumpBtn">↑</div>

  <div id="hotbar">
    <div class="slot selected" data-block="1"><span class="num">1</span><div class="color" style="background:#4caf50"></div></div>
    <div class="slot" data-block="2"><span class="num">2</span><div class="color" style="background:#8b5a2b"></div></div>
    <div class="slot" data-block="3"><span class="num">3</span><div class="color" style="background:#888888"></div></div>
    <div class="slot" data-block="4"><span class="num">4</span><div class="color" style="background:#e8d68a"></div></div>
    <div class="slot" data-block="5"><span class="num">5</span><div class="color" style="background:#6b4423"></div></div>
  </div>

  <div id="info">
    <div class="row"><span>X: <span class="val" id="infoX">0</span></span><span>Z: <span class="val" id="infoZ">0</span></span><span>Y: <span class="val" id="infoY">0</span></span></div>
  </div>

  <div id="crosshair"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
